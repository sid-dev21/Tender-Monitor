[project]
name = "tender-monitor"
version = "0.1.0"
description = "Tender Monitor — config-driven web scraping SaaS for Burkina Faso public tenders (BTP sector)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # --- Web framework ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.18",
    # --- Config & validation ---
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "email-validator>=2.2",
    # --- Database (async pymongo, NOT Motor) ---
    "pymongo>=4.9",
    # --- HTTP + browser automation (3-tier fetch) ---
    "httpx>=0.28",
    "playwright>=1.49",
    "playwright-stealth>=1.0.6",
    "fake-useragent>=2.0",
    "tenacity>=9.0",
    # --- Content extraction ---
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "pdfplumber>=0.11",
    # --- Scheduling ---
    "apscheduler>=3.11",
    # --- Auth & security ---
    "python-jose[cryptography]>=3.3",
    "argon2-cffi>=23.1",
    # --- Notifications ---
    "aiosmtplib>=3.0",
    "jinja2>=3.1",
    # --- CAPTCHA (deferred feature; dep present, gated by CAPTCHA_ENABLED) ---
    "python-anticaptcha>=1.0.0",
    # --- Logging ---
    "loguru>=0.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "testcontainers[mongodb]>=4.9",
    "vcrpy>=6.0",
    "pytest-vcr>=1.0",
    "ruff>=0.8",
    "black>=24.10",
    "mypy>=1.14",
    "pre-commit>=4.0",
    "types-python-jose>=3.3",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "ASYNC"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: hits real live target sites (opt-in via RUN_INTEGRATION=1)",
    "slow: slow tests (docker compose, perf)",
    "captcha: requires CAPTCHA solving budget (skipped by default)",
]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]

[tool.coverage.report]
show_missing = true
